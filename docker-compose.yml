services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: thyme
      POSTGRES_USER: thyme
      POSTGRES_PASSWORD: thyme-local-password
    ports:
      - "5432:5432"
    volumes:
      - thyme_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thyme -d thyme"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  thyme_postgres:
