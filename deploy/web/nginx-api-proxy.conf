# WEB tier: add inside the existing server { } block that serves the site
# (for example /etc/nginx/conf.d/thyme.conf), then: sudo nginx -t && sudo systemctl reload nginx
#
# Sends /api/* to the INTERNAL load balancer in front of the app tier. The browser only ever talks
# to the public ALB, and the app tier has no public IP.

location /api/ {
    proxy_pass http://INTERNAL-ALB-DNS-NAME;        # e.g. internal-thyme-app-123456.us-east-1.elb.amazonaws.com
    proxy_http_version 1.1;

    # Keep the host name exactly as the browser sent it (including a port, if any).
    # The API compares it with the Origin header (CSRF check): changing it makes every POST return 403.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # The public ALB terminates HTTPS and sets this header; pass it along (empty -> http).
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
    client_max_body_size  64k;
}

# Basic response hardening for the pages themselves (the API sets its own headers).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Once the ALB serves HTTPS, also add:
# add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
