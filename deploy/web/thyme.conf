# /etc/nginx/conf.d/thyme.conf  (WEB tier)
# Replace APP_PRIVATE_IP with the app server's private IPv4 (EC2 console), then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# The stock Amazon Linux server block in /etc/nginx/nginx.conf also listens on port 80 with
# server_name "_" and wins over this file ("conflicting server name" warning). Move it off port 80:
#   sudo sed -i '0,/listen[[:space:]]\+80;/s//listen 8081;/' /etc/nginx/nginx.conf
#   sudo sed -i '0,/listen[[:space:]]\+\[::\]:80;/s//listen [::]:8081;/' /etc/nginx/nginx.conf
server {
    listen 80 default_server;
    server_name _;

    location /api/ {
        proxy_pass http://APP_PRIVATE_IP:3001;
        proxy_http_version 1.1;
        # Keep Host exactly as the browser sent it: the API compares it with Origin (CSRF check).
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Without a load balancer $scheme is correct. Behind an ALB doing HTTPS, use $http_x_forwarded_proto instead.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        client_max_body_size  64k;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Once HTTPS is in place, also add:
    # add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
}
